---
name: Release

concurrency:
  group: queue

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_run:
    workflows: ['CI']
    branches: ['master']
    types:
      - completed

jobs:
  information:
    if: |
      github.event_name == 'release'
      ||  (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success'
      )
    name: ℹ️ Gather information
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.release.outputs.environment }}
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          # Full history and tags, to find the latest stable release
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: ℹ️ Gather version and environment
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REF: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${EVENT_NAME}" = "release" ]]; then
            version="${TAG_NAME,,}"
            version="${version#v}"
            environment="stable"
            if [[ "${IS_PRERELEASE}" = "true" ]]; then
              environment="beta"
            fi
          else
            # Every successful CI run on master becomes an alpha of the
            # next patch release, e.g. 0.1.8 -> 0.1.9a42
            environment="edge"
            latest=$(git tag --list \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' \
              | sort -V \
              | tail -n 1)
            latest="${latest:-0.0.0}"
            IFS=. read -r major minor patch <<< "${latest}"
            version="${major}.${minor}.$((patch + 1))a${RUN_NUMBER}"
          fi

          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  release:
    name: 👷 Build & Release
    needs:
      - information
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      wheel: ${{ steps.wheel.outputs.file }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.information.outputs.ref }}
      - name: 🏗 Set up Poetry
        run: pipx install poetry
      - name: 🏗 Set up Python 3.10
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'poetry'
      - name: 🏗 Install workflow dependencies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      # Building the package needs only Poetry, not the project's
      # dependencies, some of which have no wheels for the newest Python yet
      - name: 🏗 Set package version
        env:
          VERSION: ${{ needs.information.outputs.version }}
        run: poetry version --no-interaction "${VERSION}"
      - name: 🏗 Build package
        run: poetry build --no-interaction
      - name: 🚀 Publish the alpha as a GitHub pre-release
        # Edge builds are not sent to PyPI, the edge app installs the wheel
        # attached to this pre-release
        if: needs.information.outputs.environment == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.information.outputs.ref }}
          VERSION: ${{ needs.information.outputs.version }}
        run: |
          gh release create "${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${REF}" \
            --prerelease \
            --title "${VERSION}" \
            --notes "Alpha build of ${REF} for the edge app."
      - name: 🚀 Attach the beta to its GitHub pre-release
        # Betas are not sent to PyPI, the beta app installs the wheel attached
        # to the pre-release
        if: needs.information.outputs.environment == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
      - name: ℹ️ Find the wheel
        id: wheel
        run: |
          wheels=(dist/*.whl)
          echo "file=$(basename "${wheels[0]}")" >> "$GITHUB_OUTPUT"
      - name: 🚀 Publish to PyPi
        if: |
          needs.information.outputs.environment == 'stable'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry config pypi-token.pypi "${PYPI_TOKEN}"
          poetry publish --no-interaction

  app:
    name: 📢 Update the ${{ needs.information.outputs.environment }} app
    # Runs after the release job, so a stable version is already on PyPI
    if: |
      needs.information.outputs.environment == 'stable'
      || needs.information.outputs.environment == 'beta'
      || needs.information.outputs.environment == 'edge'
    needs:
      - information
      - release
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Ask the app repository to build a new version
        # peter-evans/repository-dispatch v4.0.1
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/app-redreactor
          event-type: redreactor-release
          # The GitHub release: the published tag for stable and beta, the
          # alpha version for edge. Stable installs from PyPI, beta and edge
          # from the wheel attached to the release
          client-payload: >
            {
              "channel": "${{ needs.information.outputs.environment }}",
              "tag": "${{ github.event.release.tag_name || needs.information.outputs.version }}",
              "wheel": "${{ needs.release.outputs.wheel }}"
            }
