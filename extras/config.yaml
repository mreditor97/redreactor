---
# Red Reactor MQTT Configuration file

# MQTT Configuration
mqtt:
  broker: 127.0.0.1 # MQTT Broker Address
  port: 1883 # MQTT Port
  user: testing # MQTT Broker username
  password: testing # MQTT Broker password
  version: 5 # MQTT Version 5 or 3

  # client_id: Red Reactor # Connection Client ID - Defaults to redreactor-<hostname name>, must be unique per broker

  base_topic: redreactor # Red Reactor base publish topic
  topic:
    state: state # Main data push topic
    status: status # Status topic
    set: set # Command topic

  exit_on_fail: true # Close on MQTT setup failure

# Hostname Configuration
hostname:
  name: redreactor-pi
  pretty: Red Reactor PI

# Home Assistant Configuration
homeassistant:
  discovery: true # Enable Home Assistant autodiscovery
  topic: homeassistant # Home Assistant discovery topic
  status_topic: homeassistant/status # Home Assistant birth / status topic
  status_online: online # Payload Home Assistant sends when it comes online
  discovery_interval: 120 # Discovery configuration push interval
  expire_after: 120 # Adds a MQTT expire time to data received by Home Assistant

# Battery level, see Battery level in the README
# battery:
#   internal_resistance: 35 # mΩ, 0 turns the load correction off
#   average_readings: 6 # Readings averaged for the battery level, 1 turns it off
#   curve: # [resting voltage, level %] pairs, left out uses a straight line
#     # Example for a Samsung INR18650-35E, approximate, read off a 0.2A discharge chart
#     - [2.80, 0]
#     - [3.08, 5]
#     - [3.25, 10]
#     - [3.39, 15]
#     - [3.44, 20]
#     - [3.55, 30]
#     - [3.63, 40]
#     - [3.71, 50]
#     - [3.80, 60]
#     - [3.89, 70]
#     - [3.99, 80]
#     - [4.06, 90]
#     - [4.08, 95]
#     - [4.16, 100]

# System Commands
system:
  shutdown: sudo shutdown 0 -h
  restart: sudo shutdown 0 -r

# Logging Levels
logging:
  console: DEBUG
  file: INFO
